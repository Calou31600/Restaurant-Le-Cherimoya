<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | Le Chérimoya</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(207, 168, 110, 0.3);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(207, 168, 110, 0.05);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            color: var(--text-main);
            margin: 0.5rem 0 1rem;
            line-height: 1.2;
        }

        .login-desc {
            color: var(--text-dim);
            line-height: 1.7;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .login-separator {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 1.5rem auto;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #ffffff;
            color: #3c4043;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .google-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            opacity: 0.7;
        }

        .back-link:hover {
            color: var(--accent);
            opacity: 1;
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
            filter: grayscale(30%);
        }
    </style>
</head>

<body>
    <div class="hero-bg"></div>
    <div class="dynamic-overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <span class="lock-icon">🔐</span>
            <div class="login-logo">Le Chérimoya</div>
            <h1 class="login-title">Espace Administration</h1>
            <div class="login-separator"></div>
            <p class="login-desc">
                Connectez-vous avec votre compte Google autorisé pour gérer la carte, les réservations et le contenu du
                restaurant.
            </p>

            <a href="/login/google" class="google-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Se connecter avec Google
            </a>

            <a href="/" class="back-link">← Retour au site</a>
        </div>
    </div>
</body>

</html>
