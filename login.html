<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | Le Chérimoya</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--accent);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin-top: 2rem;
            width: 100%;
        }

        .google-btn:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="hero-bg"></div>
    <div class="dynamic-overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <h1 style="font-family: var(--font-heading); color: var(--accent); margin-bottom: 1rem;">Administration</h1>
            <p style="color: var(--text-dim); line-height: 1.6;">Veuillez vous connecter avec votre compte Google
                autorisé pour accéder à la gestion du restaurant.</p>

            <a href="/login/google" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"
                    class="google-icon" alt="Google">
                Se connecter avec Google
            </a>

            <div style="margin-top: 2rem;">
                <a href="/" style="color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">← Retour au
                    site</a>
            </div>
        </div>
    </div>
</body>

</html>
